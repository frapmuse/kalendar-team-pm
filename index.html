<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalendar Team PM</title>
<meta name="description" content="Semak siapa available sebelum kunci tarikh shoot.">
<meta name="theme-color" content="#2DBBF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Team PM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#2DBBF9; --brand-ink:#0b6f9c;
  --bg:#f4f7fa; --card:#ffffff; --ink:#0f1c26; --muted:#5d6b77; --line:#e3e9ee;
  --ok:#16a34a; --ok-bg:#dcfce7; --warn:#b45309; --warn-bg:#fef3c7; --bad:#dc2626; --bad-bg:#fee2e2;
  --past:#eef1f4; --shadow:0 1px 2px rgba(15,28,38,.06),0 4px 16px rgba(15,28,38,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --brand-ink:#7fd6fc;
    --bg:#0c141a; --card:#141f27; --ink:#e8f0f5; --muted:#93a3ae; --line:#24323c;
    --ok:#4ade80; --ok-bg:#12321f; --warn:#fbbf24; --warn-bg:#3a2d0c; --bad:#f87171; --bad-bg:#3d1717;
    --past:#10191f; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,-apple-system,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.brand h1{font-size:18px;margin:0;font-weight:600;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;flex:none}
.dot{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.banner{margin:0 0 12px;padding:10px 14px;border-radius:12px;font-size:13px;background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--bad-bg);color:var(--bad)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-bottom:12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.mode button{border:0;background:none;padding:10px 8px;border-radius:10px;font-size:14px;color:var(--muted)}
.mode button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:600}
.cal{padding:12px 10px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.cal-head h2{margin:0;font-size:18px;font-weight:600}
.nav{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px}
.today-btn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 6px;font-weight:500}
.day{position:relative;aspect-ratio:1/1.12;border:0;border-radius:12px;padding:5px 3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--ok-bg);font-size:14px;font-weight:500;min-width:0}
.day.out{visibility:hidden}
.day.warn{background:var(--warn-bg)}
.day.bad{background:var(--bad-bg)}
.day.past{background:var(--past);color:var(--muted);opacity:.7}
.day.today .num{background:var(--ink);color:var(--card);border-radius:999px;padding:0 6px}
.day.sel{outline:2.5px solid var(--brand);outline-offset:1px}
.day.mine::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--me,#999)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;min-height:16px}
.dots .dot{width:16px;height:16px;font-size:9px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 6px 2px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.detail{margin-top:12px;padding:16px}
.detail h3{margin:0 0 4px;font-size:17px;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.past{background:var(--past);color:var(--muted)}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.people li{display:flex;align-items:center;gap:10px;font-size:14px}
.people .who{flex:1;min-width:0}
.people .note{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px}
.tag.ok{color:var(--ok);background:var(--ok-bg)} .tag.no{color:var(--bad);background:var(--bad-bg)}
.actions{display:grid;gap:8px;margin-top:14px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:600;background:var(--brand);color:#fff;width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.note-row{display:flex;gap:8px}
input[type=text],input[type=password],input[inputmode]{font:inherit;font-size:16px;flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.find{margin-top:12px}
.freep{margin-top:12px;padding:14px 14px 12px}
.freep h3{margin:0;font-size:15px;font-weight:600}
.freep .sub{font-size:12px;color:var(--muted);margin:2px 0 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid transparent;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.15}
.chip b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.chip small{font-size:11px}
.chip.sel{border-color:var(--brand)}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0;line-height:1.45}
/* Lembaran bawah */
.sheet-bg{position:fixed;inset:0;background:rgba(5,12,18,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:85dvh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px)}
.sheet h3{margin:0 0 4px;font-size:18px}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:12px;border:1px solid var(--line);margin:8px 0 12px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff;font-weight:600}
.free-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.free-list li button{width:100%;text-align:left;border:1px solid var(--line);background:var(--ok-bg);border-radius:12px;padding:11px 14px;font-size:15px;display:flex;justify-content:space-between}
.free-list li small{color:var(--muted)}
.pick{display:grid;gap:10px;margin-top:12px}
.pick button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-size:16px;text-align:left}
.pick button[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.pick .dot{width:36px;height:36px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.sync{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
@media (max-width:360px){.day{font-size:13px}.dots .dot{width:14px;height:14px;font-size:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">PM</div>
      <div><h1>Kalendar Team PM</h1><small>Siapa ada, siapa tak ada</small></div>
    </div>
    <button class="me" id="meBtn" aria-label="Tukar siapa saya"></button>
  </header>

  <div id="banner"></div>

  <div class="mode" role="group" aria-label="Mod tekan">
    <button id="modeMark" aria-pressed="true">✋ Tanda saya</button>
    <button id="modeView" aria-pressed="false">👀 Lihat sahaja</button>
  </div>

  <section class="card cal">
    <div class="cal-head">
      <h2 id="monthTitle"></h2>
      <div class="nav">
        <button class="today-btn" id="todayBtn">Hari ini</button>
        <button class="icon-btn" id="prevBtn" aria-label="Bulan lepas">‹</button>
        <button class="icon-btn" id="nextBtn" aria-label="Bulan depan">›</button>
      </div>
    </div>
    <div class="grid" id="dow"></div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--ok)"></i>Semua ada, boleh lock</span>
      <span><i class="sw" style="background:var(--warn)"></i>Ada yang tak ada</span>
      <span><i class="sw" style="background:var(--bad)"></i><span id="legendBad">Boss/Amin tak ada</span></span>
    </div>
  </section>

  <section class="card freep" id="freePanel"></section>

  <section class="card detail" id="detail"></section>

  <div class="find">
    <button class="btn" id="findBtn">🔎 Cari tarikh kosong</button>
    <p class="hint" id="hint"></p>
  </div>

  <p class="sync" id="sync"></p>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
